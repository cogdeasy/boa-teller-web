<nav class="navbar navbar-default navbar-static-top boa-navbar">

      </a>
    </div>
    <ul class="nav navbar-nav">
      <li ng-class="{active: $state.includes('console.lookup') || $state.includes('console.customer')}">

      </li>
      <li ng-class="{active: $state.includes('console.search')}">
        <a ui-sref="console.search"><span class="glyphicon glyphicon-search"></span> Transaction search</a>
      </li>

    </ul>

        <input type="text" class="form-control" placeholder="Go to account #" maxlength="12"

        <span class="input-group-btn">
          <button class="btn btn-default" type="submit"><span class="glyphicon glyphicon-arrow-right"></span></button>
