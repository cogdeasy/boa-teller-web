<div class="boa-login">
  <div class="boa-login-brand">
    <span class="boa-mark boa-mark-lg">BofA</span>
    <h1>Bank of America</h1>
    <p>Branch Teller Console</p>
  </div>
  <div class="panel panel-default boa-login-panel">
    <div class="panel-body">
      <h4>Sign in</h4>
      <form name="loginForm" ng-submit="submit()" novalidate>
        <div class="form-group">
          <label for="username">User ID</label>
          <input id="username" class="form-control" ng-model="credentials.username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" class="form-control" ng-model="credentials.password" required>
        </div>
        <div boa-alert="error"></div>
        <button type="submit" class="btn btn-primary btn-block" ng-disabled="busy || loginForm.$invalid">
          <span ng-show="busy">Verifying&hellip;</span><span ng-hide="busy">Sign in</span>
        </button>
      </form>
    </div>
    <div class="panel-footer small text-muted">
      Authorised Bank of America staff only. Use of this system is logged and subject to audit.
    </div>
  </div>
</div>
